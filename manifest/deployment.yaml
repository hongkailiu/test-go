apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-builder
  labels:
    app: graph-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graph-builder
  template:
    metadata:
      labels:
        app: graph-builder
    spec:
      serviceAccountName: graph-builder
      containers:
        - name: graph-builder
          image: quay.io/hongkliu/test:graph-builder-011
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /graph
              port: 8080
              scheme: HTTP
          ports:
            - containerPort: 8080