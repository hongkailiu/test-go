---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: graph-builder
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
subjects:
  - kind: ServiceAccount
    name: graph-builder
    namespace: hongkliu-test
roleRef:
  kind: Role
  name: graph-builder
  apiGroup: rbac.authorization.k8s.io