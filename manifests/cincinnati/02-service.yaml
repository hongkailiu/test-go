---
apiVersion: v1
kind: Service
metadata:
  name: cincinnati
  namespace: cincinnati-go
  labels:
    app: cincinnati
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: cincinnati-serving-cert
spec:
  selector:
    app: cincinnati
  ports:
  - name: main
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
