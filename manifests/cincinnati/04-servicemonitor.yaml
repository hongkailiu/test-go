apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: cincinnati
  name: cincinnati
  namespace: cincinnati-go
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: https
    tlsConfig:
      serverName: cincinnati.cincinnati-go.svc
      ca:
        configMap:
          name: serving-certs-ca-bundle
          key: service-ca.crt
  selector:
    matchLabels:
      app: cincinnati
