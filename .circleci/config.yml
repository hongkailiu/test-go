version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build:
    docker:
      - image: cimg/go:1.25
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}

      - run:
          name: Install Dependencies
          command: go get ./...

      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"

      - run:
          name: Verify code
          command: make verify

      - run:
          name: Build binary
          command: hack/build.sh

  lint-yaml:
    docker:
      - image: python:3.11
    steps:
      - checkout
      - run: pip install yamllint
      - run: yamllint .

# Define the workflow to run the job
workflows:
  version: 2
  build_workflow:
    jobs:
      - build
      - lint-yaml
